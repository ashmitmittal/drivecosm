<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DriveCosm: all your cloud storage, one place</title>
    <meta
      name="description"
      content="DriveCosm pools every Google Drive account you own into one drive with one search bar. Free and open source to self-host; DriveCosm Cloud with AI search is coming soon."
    />
    <link rel="canonical" href="https://drivecosm.com/" />
    <meta name="theme-color" content="#05060e" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DriveCosm" />
    <meta property="og:url" content="https://drivecosm.com/" />
    <meta property="og:title" content="DriveCosm: all your cloud storage, one place" />
    <meta
      property="og:description"
      content="Pool every Google Drive account you own into one drive with one search bar. Free to self-host; DriveCosm Cloud is coming soon."
    />
    <meta name="twitter:card" content="summary" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 120%22><ellipse cx=%2260%22 cy=%2260%22 rx=%2246%22 ry=%2219%22 transform=%22rotate(-22 60 60)%22 fill=%22none%22 stroke=%22%239AA0B8%22 stroke-width=%228%22/><circle cx=%2260%22 cy=%2260%22 r=%2222%22 fill=%22%237C6CFF%22/></svg>"
    />
    <script>
      // Applies the saved (or system) theme before first paint to avoid a flash.
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
